---
# Trunk configuration for the canonical phenoEvents repository.
# Keep this file on the version 0.1 schema consumed by current Trunk CLI.
version: 0.1

cli:
  version: 1.22.2

plugins:
  sources:
    - id: trunk
      ref: v1.6.1
      uri: https://github.com/trunk-io/plugins

lint:
  enabled:
    - actionlint@1.7.7
    - git-diff-check
    - prettier@3.5.3
    - yamllint@1.37.1
  disabled:
    - trufflehog
    - trivy
    - prettier

actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
