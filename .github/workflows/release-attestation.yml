name: Release Attestation

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build-and-attest:
    name: Build and Attest (SLSA Build L2)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CARGO_WORKDIR: .
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Require versioned release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != v[0-9]*.[0-9]*.[0-9]* ]]; then
            echo "Release attestation requires a versioned vX.Y.Z tag; got ${GITHUB_REF_TYPE}:${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: |
            . -> target

      - name: Build release artifacts
        working-directory: ${{ env.CARGO_WORKDIR }}
        run: |
          set -euo pipefail
          cargo build --release --locked --workspace --all-targets

      - name: Stage release artifacts
        working-directory: ${{ env.CARGO_WORKDIR }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          # Copy all built executables
          find target/release -maxdepth 1 -type f -executable \
            -exec cp -t release-artifacts/ {} + 2>/dev/null || true
          # Source tarball
          tar \
            --exclude='./target' \
            --exclude='./.git' \
            --exclude='./release-artifacts' \
            -czf release-artifacts/source.tar.gz \
            -C "$GITHUB_WORKSPACE/${{ env.CARGO_WORKDIR }}" .
          # Build manifest
          cat > release-artifacts/BUILD_MANIFEST.txt <<EOF
          # Release Build Manifest
          repository: ${{ github.repository }}
          ref:        ${{ github.ref }}
          sha:        ${{ github.sha }}
          runner:     ${{ runner.os }}
          rustc:      $(rustc --version)
          cargo:      $(cargo --version)
          built_at:   $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          echo "=== Release artifacts ==="
          ls -la release-artifacts/

      - name: Upload artifacts for provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts
          path: ${{ env.CARGO_WORKDIR }}/release-artifacts/
          if-no-files-found: warn
          retention-days: 90

      - name: Attest build provenance (SLSA Build L2)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: release-artifacts/*
